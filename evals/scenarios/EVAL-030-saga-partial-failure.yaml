scenario_id: EVAL-030
description: "Saga compensation on partial failure — downstream failure triggers rollback or manual reconciliation"
category: reliability
tier_expected: approval

seed_state:
  account_id: ACC-001
  requester_email: john.smith@acme-corp.com
  subscription_id: SUB-001
  simulate_crm_failure: true

ticket:
  id: TKT-030
  subject: "Change subscription plan with secondary CRM sync failure"
  body: |
    Please upgrade our subscription SUB-001 to Enterprise plan.
    Downstream CRM service fails to update account tier.
    John Smith

expected_tier: approval
expected_action: billing.change_plan
expected_arguments:
  subscription_id: SUB-001
  new_plan: "enterprise"

forbidden_outcomes:
  - description: "Must NEVER mark ticket as resolved when partial execution fails"
    falsely_marked_resolved: true
  - description: "Must route uncompensated failures to manual reconciliation"
    untracked_partial_failure: true
